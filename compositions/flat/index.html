<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"moduleId","type":"string","label":"Module id","default":"obxd"},{"id":"name","type":"string","label":"Output name","default":"obxd"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="data/modules.js"></script>
    <script src="lib/oled.js"></script>
    <style>
      @font-face { font-family: "Plus Jakarta Sans"; font-weight: 400; src: url("assets/fonts/plus-jakarta-sans-400.woff2") format("woff2"); }
      @font-face { font-family: "Plus Jakarta Sans"; font-weight: 500; src: url("assets/fonts/plus-jakarta-sans-500.woff2") format("woff2"); }
      @font-face { font-family: "Plus Jakarta Sans"; font-weight: 700; src: url("assets/fonts/plus-jakarta-sans-700.woff2") format("woff2"); }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("assets/fonts/ibm-plex-mono-400.woff2") format("woff2"); }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 600; src: url("assets/fonts/ibm-plex-mono-600.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0a0a; }
      #root {
        position: relative; width: 100%; height: 100%; overflow: hidden;
        background: radial-gradient(1200px 800px at 68% 42%, #17191c 0%, #0d0e10 55%, #08090a 100%);
        font-family: "Plus Jakarta Sans", sans-serif; color: #f2f2f2;
      }
      .scene { position: absolute; inset: 0; }
      #brand { position: absolute; left: 96px; top: 64px; width: 222px; height: 36px; image-rendering: pixelated; mix-blend-mode: screen; }
      #crumb { position: absolute; right: 96px; top: 68px; font-family: "IBM Plex Mono", monospace; font-size: 22px; letter-spacing: 0.08em; color: #8a8a8a; text-transform: uppercase; }
      /* left column */
      #info { position: absolute; left: 96px; top: 168px; width: 600px; }
      #badge { display: inline-block; font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 20px; letter-spacing: 0.14em; text-transform: uppercase; color: #0a0a0a; background: #e9eef3; padding: 8px 14px; border-radius: 2px; }
      #name { margin-top: 26px; font-weight: 700; font-size: 104px; line-height: 0.98; letter-spacing: -0.03em; }
      #author { margin-top: 18px; font-size: 28px; font-weight: 500; color: #a8a8a8; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      #desc { margin-top: 26px; font-size: 27px; line-height: 1.38; color: #d6d6d6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
      /* pad grid + steps: the Move's surface, lit by the same notes the audio plays */
      #pads { position: absolute; left: 96px; top: 712px; width: 600px; height: 214px; }
      .pad { position: absolute; width: 66px; height: 46px; border-radius: 6px; }
      #steps { position: absolute; left: 96px; top: 952px; width: 600px; height: 14px; }
      .step { position: absolute; top: 0; width: 14px; height: 14px; border-radius: 50%; }
      /* screen */
      #bezel {
        position: absolute; left: 768px; top: 168px; width: 1080px; height: 568px; border-radius: 22px;
        background: linear-gradient(160deg, #1d1f22 0%, #121315 60%, #0e0f10 100%);
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }
      #glass { position: absolute; left: 28px; top: 28px; width: 1024px; height: 512px; border-radius: 6px; overflow: hidden; background: #0e1014; box-shadow: inset 0 0 0 2px #050607; }
      #oled-glow { position: absolute; left: 0; top: 0; width: 1024px; height: 512px; filter: blur(14px); opacity: 0.5; }
      #oled { position: absolute; left: 0; top: 0; width: 1024px; height: 512px; }
      #sheen { position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0) 38%, rgba(255,255,255,0) 100%); }
      /* encoders */
      #knobs { position: absolute; left: 768px; top: 790px; width: 1080px; height: 110px; }
      .knob { position: absolute; top: 0; width: 64px; height: 64px; }
      .knob .cap { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 38% 32%, #3a3c40 0%, #212225 55%, #151618 100%); box-shadow: 0 6px 14px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08); }
      .knob .tick { position: absolute; left: 30px; top: 6px; width: 4px; height: 16px; border-radius: 2px; background: #9aa0a6; }
      .knob .led { position: absolute; left: 28px; top: 80px; width: 8px; height: 8px; border-radius: 50%; background: #2a2d31; }
      .knob .ring { position: absolute; inset: -8px; border-radius: 50%; border: 2px solid #e9f3ff; opacity: 0; }
      #foot { position: absolute; left: 768px; right: 96px; bottom: 60px; display: flex; justify-content: space-between; font-family: "IBM Plex Mono", monospace; font-size: 20px; color: #6f6f6f; letter-spacing: 0.06em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div id="scene" class="scene clip" data-start="0" data-duration="12" data-track-index="0">
        <img id="brand" src="assets/logo-text.png" alt="Schwung" />
        <div id="crumb">Module Catalog</div>
        <div id="info">
          <div><span id="badge">Sound Generator</span></div>
          <div id="name">OB-Xd</div>
          <div id="author">by Charles Vestal</div>
          <div id="desc">Virtual analog synthesizer based on Oberheim OB-X</div>
        </div>
        <div id="pads"></div>
        <div id="steps"></div>
        <div id="bezel">
          <div id="glass">
            <canvas id="oled-glow" width="1024" height="512"></canvas>
            <canvas id="oled" width="1024" height="512"></canvas>
            <div id="sheen"></div>
          </div>
        </div>
        <div id="knobs"></div>
        <div id="foot"><span>schwung.dev/catalog</span><span>Real Schwung UI · real module DSP</span></div>
      </div>
    </div>

    <script>
      (function () {
        const vars = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const id = vars.moduleId || "obxd";
        const M = (window.MODULES || {})[id] || { name: id, author: "", type: "", desc: "", tags: [] };

        document.getElementById("badge").textContent = M.type;
        const nameEl = document.getElementById("name");
        nameEl.textContent = M.name;
        const n = M.name.length;
        nameEl.style.fontSize = (n <= 8 ? 112 : n <= 12 ? 96 : n <= 16 ? 80 : n <= 20 ? 68 : 58) + "px";
        document.getElementById("author").textContent = M.author ? "by " + M.author : "";
        document.getElementById("desc").textContent = M.desc;
        document.getElementById("crumb").textContent = "Module Catalog / " + M.type;

        const strip = document.getElementById("knobs");
        const knobEls = [];
        for (let i = 0; i < 8; i++) {
          const k = document.createElement("div");
          k.className = "knob";
          k.style.left = (40 + i * ((1080 - 80 - 64) / 7)) + "px";
          k.innerHTML = '<div class="ring"></div><div class="cap"><div class="tick"></div></div><div class="led"></div>';
          strip.appendChild(k);
          knobEls.push({ cap: k.querySelector(".cap"), ring: k.querySelector(".ring"), led: k.querySelector(".led") });
        }
        const padEls = [];
        const padWrap = document.getElementById("pads");
        for (let i = 0; i < 32; i++) {
          const el = document.createElement("div");
          el.className = "pad";
          const row = Math.floor(i / 8), col = i % 8;           // row 0 = bottom
          el.style.left = (col * 76.3) + "px";
          el.style.top = ((3 - row) * 56) + "px";
          padWrap.appendChild(el);
          padEls.push(el);
        }
        const stepEls = [];
        const stepWrap = document.getElementById("steps");
        for (let i = 0; i < 16; i++) {
          const el = document.createElement("div");
          el.className = "step";
          el.style.left = (26 + i * 36.5) + "px";
          stepWrap.appendChild(el);
          stepEls.push(el);
        }

        const oled = document.getElementById("oled").getContext("2d");
        const glow = document.getElementById("oled-glow").getContext("2d");

        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["oled-" + id] = OledLib.loadModule(id).then((o) => {
          function draw(t) {
            OledLib.drawCells(oled, o, t, 8, 1.4, 1);
            glow.clearRect(0, 0, 1024, 512);
            glow.drawImage(oled.canvas, 0, 0);
            const ks = OledLib.knobState(o, t);
            for (let i = 0; i < 8; i++) {
              const e = knobEls[i];
              e.cap.style.transform = "rotate(" + (ks.angle[i] * 57.2958).toFixed(2) + "deg)";
              e.ring.style.opacity = (ks.touched[i] * 0.9).toFixed(3);
              const l = 42 + ks.touched[i] * 200;
              e.led.style.background = "rgb(" + Math.round(l * 0.92) + "," + Math.round(l * 0.97) + "," + Math.round(l) + ")";
            }
            const ps = OledLib.padState(o, t, M.ctype);
            for (let i = 0; i < 32; i++) {
              const p = ps[i], k = p.level;
              const c = p.rgb.map((v) => Math.round(18 + (v - 18) * k));
              padEls[i].style.background = "rgb(" + c.join(",") + ")";
              padEls[i].style.boxShadow = k > 0.3 ? "0 0 " + Math.round(20 * k) + "px rgba(" + p.rgb.join(",") + "," + (0.45 * k).toFixed(2) + ")" : "none";
            }
            const ss = OledLib.stepState(o, t);
            for (let i = 0; i < 16; i++) {
              const v = Math.round(30 + ss[i] * 210);
              stepEls[i].style.background = "rgb(" + v + "," + v + "," + Math.min(255, v + 6) + ")";
            }
          }
          const tl = gsap.timeline({ paused: true });
          const clock = { t: 0 };
          tl.to(clock, { t: 12, duration: 12, ease: "none", onUpdate: () => draw(clock.t) }, 0);
          window.__timelines["main"] = tl;
          tl.seek(0);
          draw(0);
        });
      })();
    </script>
  </body>
</html>
