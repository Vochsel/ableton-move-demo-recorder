name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: bash scripts/check.sh
      - run: node bin/mdr help
  host:
    # the headless plugin host is built and run for aarch64, like the Move
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t schost pipeline/host
      - run: docker run --rm schost sh -c 'schost 2>&1 | grep -q usage'
